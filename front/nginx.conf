# Configuration Nginx du conteneur "front".
# Rôle : (1) servir le site compilé, (2) transmettre /api et /health à l'API.
# C'est ce "reverse proxy" qui remplace le proxy de Vite utilisé en développement.
#
# Ce fichier est un "template" : ${NGINX_LOCAL_RESOLVERS} est remplacé au démarrage
# du conteneur par l'adresse du serveur DNS du réseau Docker (voir Dockerfile).

# Cache-Control calculé ici, au niveau "http", et non avec add_header dans une
# location : add_header n'est PAS hérité. Dès qu'une location a son propre add_header,
# elle perd tous les en-têtes de sécurité posés au niveau "server" (CSP comprise).
# Une valeur vide : Nginx n'envoie pas l'en-tête.
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "";
}

server {
    listen 80;
    server_name _;

    # Ne pas annoncer la version de Nginx.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- En-têtes de sécurité ---
    # CSP : seules les ressources de notre propre origine sont autorisées. Le build
    # Vite n'a ni script ni style inline, donc pas de 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control $cache_control;

    # Masquer l'en-tête X-Powered-By: Express des réponses de l'API.
    proxy_hide_header X-Powered-By;

    # DNS utilisé pour retrouver l'adresse du service "api". valid=10s : on
    # re-demande l'adresse toutes les 10 s. Sans cela, Nginx mémoriserait l'IP de l'API
    # une fois pour toutes : après un redéploiement de l'API (nouveau conteneur, donc
    # parfois nouvelle IP), il enverrait ses requêtes dans le vide -> erreur 502.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # Le nom "api" est celui du service dans compose.yaml : le réseau Docker le résout.
    # On le met dans une variable pour que Nginx le résolve à chaque requête
    # (et pas une seule fois au démarrage).
    set $api_upstream http://api:3000;

    # Les appels /api/... partent vers l'API (le chemin est transmis tel quel).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /health aussi : pratique pour le smoke test et la supervision depuis l'extérieur.
    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Tout le reste : les fichiers du site. Si le fichier n'existe pas, on renvoie
    # index.html (utile pour les applications à une seule page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers générés par Vite ont un nom contenant un hash : ils peuvent être
    # gardés très longtemps en cache par le navigateur (en-tête posé par le "map"
    # ci-dessus). Un fichier absent donne une vraie 404, pas index.html.
    location /assets/ {
        try_files $uri =404;
    }
}
