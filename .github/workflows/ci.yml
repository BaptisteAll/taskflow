name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Pas de relance complète pour un commit qui ne touche que la doc
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

env:
  # Seuil minimal de couverture des lignes (la couverture actuelle est d'environ 81 %)
  COVERAGE_MIN: 75

# Un nouveau push sur une PR annule le run devenu inutile.
# Sur main, on n'annule jamais : chaque commit garde son verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vérifier le format (Prettier)
        run: npm run format:check
      - name: Tests unitaires avec couverture
        run: npm run test:coverage
      - name: Résumé et seuil de couverture
        run: |
          {
            echo "### Couverture de l'API (Node ${{ matrix.node }})"
            echo ""
            echo "| Mesure | Couverture |"
            echo "|---|---|"
            for k in lines statements functions branches; do
              echo "| $k | $(jq -r ".total.$k.pct" coverage/coverage-summary.json) % |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          PCT=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)
          if awk -v p="$PCT" -v min="$COVERAGE_MIN" 'BEGIN { exit !(p < min) }'; then
            echo "::error title=Couverture insuffisante::lignes ${PCT} % < ${COVERAGE_MIN} %"
            exit 1
          fi

  api-integration:
    name: api-integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Base jetable de CI, pas un secret
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Tests d'intégration
        run: npm run test:int

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Vérifier le format (Prettier)
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Publier le build en artefact
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist/
          retention-days: 7
          if-no-files-found: error
