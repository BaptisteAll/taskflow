name: Security

on:
  pull_request:
  push:
    branches: [main]
  # Une dépendance saine aujourd'hui peut avoir une CVE publiée la semaine prochaine
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique : un secret supprimé reste dans Git
      - name: Gitleaks (recherche de secrets)
        run: |
          docker run --rm -v "$PWD":/repo docker.io/zricethezav/gitleaks:latest \
            git /repo --redact --verbose

  dependances:
    name: dependances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dossier: [api, front]
    defaults:
      run:
        working-directory: ${{ matrix.dossier }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dossier }}/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Rapport npm audit complet (JSON, pour le triage)
        run: npm audit --json > audit-report.json || true
      - name: Publier le rapport
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-${{ matrix.dossier }}
          path: ${{ matrix.dossier }}/audit-report.json
          retention-days: 7
          if-no-files-found: error
      # Seules les dépendances de production font échouer le job : les alertes sur
      # les outils de test (devDependencies) sont triées via le rapport JSON ci-dessus
      # et notées dans docs/SECURITE.md (registre des exceptions), jamais masquées.
      - name: npm audit production (échec si high ou critical)
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep (analyse du code source)
        run: |
          docker run --rm -v "$PWD":/src:ro -w /src docker.io/semgrep/semgrep:1.184.0 \
            semgrep scan --config p/javascript --config p/nodejsscan --metrics=off --error

  dast:
    name: dast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Démarrer la stack TaskFlow
        run: docker compose up -d --build --wait
      - name: Vérifier que l'application répond
        run: curl -fsS http://localhost:8080/health
      - name: ZAP baseline (scan passif)
        run: |
          mkdir -p zap-out
          chmod -R a+rwx zap-out
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://localhost:8080 -I -r rapport.html
      - name: Publier le rapport ZAP
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: zap-rapport
          path: zap-out/rapport.html
          retention-days: 7
          if-no-files-found: warn
      - name: Logs de la stack en cas d'échec
        if: failure()
        run: docker compose logs
      - name: Arrêter la stack
        if: ${{ always() }}
        run: docker compose down -v
